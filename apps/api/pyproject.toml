[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mindora-api"
version = "0.1.0"
description = "MINDORA Private Personal AI - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.10",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.0.0",
]

[tool.black]
line-length = 88

[tool.ruff]
select = ["I", "E", "F", "W", "TID"]

[tool.poetry.group.dev]
test = [
    "pytest",
    "pytest-asyncio",
]
